services:

  credit-service:
    hostname: credit-service
    build: ./credit-service/
    env_file:
      - ./credit-service/.env
    environment:
      DATA_SOURCE_DB_HOST: db
    depends_on: [ "db", "common-api-starter" ]

  api-gateway:
    build: ./api-gateway/
    env_file:
      - ./api-gateway/.env
    environment:
      DATA_SOURCE_DB_HOST: db
    ports:
      - "8080:8080"
    depends_on: [ "db", "common-api-starter" ]

  common-api-starter:
    build:
      context: ./common-api-starter
      args:
        M2_PATH2: ./m3/
    image: common-api-starter:latest

  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DATA_SOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATA_SOURCE_PASSWORD}
      POSTGRES_DB: ${DATA_SOURCE_DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/

volumes:
  pgdata:
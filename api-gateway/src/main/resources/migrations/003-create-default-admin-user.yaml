              insert into users (email, password_hash) values ( 'admin@admin.ru', '$2a$12$wBSwQr4Es44j7tcnttqOUuX/xGdE/NqhVqNyFo4jNBQGVcf9qtB4W');
              insert into user_roles ( user_id, role ) values ( (select id from users where email='admin@admin.ru'), 'ROLE_USER');

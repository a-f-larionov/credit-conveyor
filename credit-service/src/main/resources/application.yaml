server:
  port:  8082

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: credit-service

  datasource:
    url: jdbc:postgresql://${DATA_SOURCE_DB_HOST}:5432/${DATA_SOURCE_DB_NAME}
    username: ${DATA_SOURCE_USERNAME}
    password: ${DATA_SOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  mail:
    host: ${MAIL_HOSTNAME}
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  signing:
    key: ${JWT_SIGNING_KEY}
    expiration_sec: ${JWT_EXPIRATION_SEC}
